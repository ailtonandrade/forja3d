<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Forja 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: bancada de três colunas (ferramentas | viewport | painel) com o viewport dominando; tema único escuro, como toda oficina 3D */
:root{
  --ground:#111418; --panel:#1a1e24; --raised:#232831; --raised-2:#2b313b; --line:#323945;
  --fg:#dce1e9; --muted:#8b94a3; --accent:#e08a4f; --accent-ink:#20140b; --sel:#62a9e4; --danger:#e26d6d; --ok:#79c28f;
  --f-ui:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--ground);color:var(--fg);font:13px/1.4 var(--f-ui);box-sizing:border-box;overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--sel);outline-offset:1px}

#app{height:100%;display:grid;grid-template-columns:50px minmax(0,1fr) 304px;grid-template-rows:44px minmax(0,1fr) 26px;
  grid-template-areas:"top top top" "tools vp panel" "status status status";
  border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel);position:relative}

/* barra superior */
#top{grid-area:top;display:flex;align-items:center;gap:8px;padding:0 10px;border-bottom:1px solid var(--line);min-width:0}
.brand{display:flex;align-items:center;gap:7px;font-weight:600;letter-spacing:.01em;white-space:nowrap;margin-right:4px}
.brand svg{color:var(--accent)}
.tb{background:transparent;border:1px solid transparent;border-radius:6px;padding:5px 9px;color:var(--fg);white-space:nowrap}
.tb:hover{background:var(--raised)}
.tb:disabled{opacity:.35;cursor:default;background:transparent}
.tb.icon{padding:5px 7px;display:inline-flex}
#projName{background:transparent;border:1px solid transparent;border-radius:6px;padding:5px 8px;min-width:70px;width:200px;flex:0 1 200px;font-weight:500}
#projName:hover{border-color:var(--line)}
#projName:focus{border-color:var(--sel);background:var(--ground);outline:none}
#saveState{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.sp{flex:1}
.menu{position:relative}
.dd{position:absolute;right:0;top:calc(100% + 4px);background:var(--raised);border:1px solid var(--line);border-radius:8px;padding:4px;min-width:210px;z-index:30;box-shadow:0 10px 30px rgba(0,0,0,.45)}
.dd button{display:flex;width:100%;text-align:left;background:none;border:0;padding:7px 10px;border-radius:5px;gap:10px;justify-content:space-between}
.dd button:hover{background:var(--raised-2)}
.dd button small{color:var(--muted);font-family:var(--f-mono);font-size:11px}
.mobile-only{display:none}

/* ferramentas */
#tools{grid-area:tools;border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0;overflow-y:auto}
.tool{width:36px;height:36px;border-radius:7px;border:1px solid transparent;background:transparent;display:grid;place-items:center;color:var(--muted);position:relative}
.tool:hover{background:var(--raised);color:var(--fg)}
.tool.on{background:var(--raised-2);color:var(--fg);border-color:var(--line)}
.tool.on::before{content:"";position:absolute;left:-7px;top:9px;bottom:9px;width:2px;border-radius:2px;background:var(--accent)}
.tool svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tool kbd{position:absolute;right:2px;bottom:1px;font:9px var(--f-mono);color:var(--muted)}
.sep{width:24px;height:1px;background:var(--line);margin:4px 0}
#addMenu{position:absolute;left:54px;top:150px;z-index:30;min-width:180px}

/* viewport */
#viewport{grid-area:vp;position:relative;min-width:0;min-height:0;background:#000;overflow:hidden;touch-action:none}
#viewport canvas{display:block;width:100%;height:100%}
#vpTop{position:absolute;left:10px;right:10px;top:10px;display:flex;flex-wrap:wrap;gap:8px;pointer-events:none}
#vpTop > *{pointer-events:auto}
.seg{display:inline-flex;background:rgba(20,23,28,.82);border:1px solid var(--line);border-radius:7px;padding:2px;backdrop-filter:blur(6px)}
.seg button{background:transparent;border:0;border-radius:5px;padding:4px 9px;color:var(--muted);font-size:12px}
.seg button:hover{color:var(--fg)}
.seg button.on{background:var(--raised-2);color:var(--fg)}
.seg button.hot{background:var(--accent);color:var(--accent-ink)}
#modeBadge{position:absolute;right:10px;bottom:10px;font:500 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;padding:4px 8px;border-radius:5px;background:rgba(20,23,28,.82);border:1px solid var(--line);color:var(--muted)}
#modeBadge.edit{color:var(--accent-ink);background:var(--accent);border-color:var(--accent)}
#hint{position:absolute;left:10px;bottom:10px;right:120px;color:var(--muted);font-size:12px;text-shadow:0 1px 2px #000;pointer-events:none}
#hint b{color:var(--fg);font-weight:500;font-family:var(--f-mono);font-size:11px;background:rgba(20,23,28,.8);border:1px solid var(--line);border-radius:3px;padding:0 4px}
#selrect{position:absolute;border:1px dashed var(--sel);background:rgba(98,169,228,.12);pointer-events:none}

/* painel */
#panel{grid-area:panel;border-left:1px solid var(--line);display:grid;grid-template-rows:minmax(110px,32%) auto minmax(0,1fr);min-height:0;background:var(--panel)}
.ph{display:flex;align-items:center;justify-content:space-between;padding:8px 12px 6px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
#outlinerWrap{display:flex;flex-direction:column;min-height:0;border-bottom:1px solid var(--line)}
#outliner{list-style:none;margin:0;padding:0 6px 6px;overflow-y:auto;min-height:0}
#outliner li{display:flex;align-items:center;gap:7px;padding:4px 6px;border-radius:5px;cursor:pointer}
#outliner li:hover{background:var(--raised)}
#outliner li.on{background:var(--raised-2);box-shadow:inset 2px 0 0 var(--accent)}
#outliner li .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#outliner li .ty{font:10px var(--f-mono);color:var(--muted)}
#outliner li input{flex:1;min-width:0;background:var(--ground);border:1px solid var(--sel);border-radius:4px;padding:1px 4px}
.eye{background:none;border:0;color:var(--muted);padding:2px;display:inline-flex}
.eye.off{opacity:.35}
.eye svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.6}
.dot{width:10px;height:10px;border-radius:3px;flex:none;border:1px solid rgba(255,255,255,.15);background-size:cover}

#tabs{display:flex;gap:2px;padding:6px 8px 0;border-bottom:1px solid var(--line)}
#tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:6px 10px;color:var(--muted)}
#tabs button.on{color:var(--fg);border-bottom-color:var(--accent)}
#props{overflow-y:auto;padding:10px 12px 18px;min-height:0;display:flex;flex-direction:column;gap:14px}
.grp{display:flex;flex-direction:column;gap:7px}
.grp h4{margin:0;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:500}
.row{display:grid;grid-template-columns:86px minmax(0,1fr);align-items:center;gap:8px}
.row > label{color:var(--muted);font-size:12px}
.v3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}
.num,.txt,select.sel{width:100%;min-width:0;background:var(--ground);border:1px solid var(--line);border-radius:5px;padding:4px 6px;font-family:var(--f-mono);font-size:12px;font-variant-numeric:tabular-nums}
.txt{font-family:var(--f-ui);font-size:13px}
select.sel{font-family:var(--f-ui)}
.num:focus,.txt:focus,select.sel:focus{border-color:var(--sel);outline:none}
.v3 .num{padding-left:18px;background-repeat:no-repeat;background-position:6px 50%;background-size:6px 12px}
.v3 .ax{position:relative}
.v3 .ax::before{content:attr(data-a);position:absolute;left:6px;top:50%;transform:translateY(-50%);font:600 10px var(--f-mono);pointer-events:none}
.v3 .ax:nth-child(1)::before{color:#e0716b}.v3 .ax:nth-child(2)::before{color:#8fc76f}.v3 .ax:nth-child(3)::before{color:#6fa3e0}
.sl{display:grid;grid-template-columns:minmax(0,1fr) 46px;gap:8px;align-items:center}
.sl input[type=range]{width:100%;accent-color:var(--accent)}
.sl output{font:12px var(--f-mono);color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
input[type=color]{width:100%;height:26px;border:1px solid var(--line);border-radius:5px;background:var(--ground);padding:2px}
.chk{display:flex;align-items:center;gap:7px;color:var(--fg);font-size:12px}
.chk input{accent-color:var(--accent)}
.btns{display:flex;flex-wrap:wrap;gap:6px}
.btn{background:var(--raised);border:1px solid var(--line);border-radius:6px;padding:5px 10px;font-size:12px}
.btn:hover{background:var(--raised-2)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:500}
.btn.dng{color:var(--danger)}
.btn.on{border-color:var(--accent);color:var(--accent)}
.note{color:var(--muted);font-size:12px;margin:0}
.empty{color:var(--muted);font-size:13px;line-height:1.5;padding:8px 0}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:6px}
.chip{border:1px solid var(--line);border-radius:7px;background:var(--ground);padding:4px;display:flex;flex-direction:column;gap:3px;align-items:stretch;text-align:left}
.chip .sw{height:34px;border-radius:4px;background-size:cover;background-position:center;border:1px solid rgba(255,255,255,.08)}
.chip span{font-size:10px;color:var(--muted);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.chip.on{border-color:var(--accent)}
.chip.on span{color:var(--fg)}
.chip.add{display:grid;place-items:center;color:var(--muted);font-size:20px;min-height:54px}

#status{grid-area:status;border-top:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 12px;font:11px var(--f-mono);color:var(--muted);white-space:nowrap;overflow:hidden;font-variant-numeric:tabular-nums}
#status .r{margin-left:auto}

/* modal de projetos */
.modal{position:fixed;inset:0;background:rgba(6,8,10,.66);display:grid;place-items:center;z-index:50;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:12px;width:min(880px,100%);max-height:100%;display:flex;flex-direction:column;overflow:hidden}
.sheet header{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.sheet header h2{margin:0;font-size:16px;font-weight:600;text-wrap:balance;margin-right:auto}
.plist{padding:16px;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.pcard{border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--ground);display:flex;flex-direction:column}
.pcard.cur{border-color:var(--accent)}
.pcard .th{aspect-ratio:16/10;max-width:100%;background:var(--raised) center/cover no-repeat;display:grid;place-items:center;color:var(--muted);font-size:12px;cursor:pointer}
.pcard .meta{padding:8px 10px;display:flex;flex-direction:column;gap:2px}
.pcard .meta b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pcard .meta small{color:var(--muted);font-size:11px}
.pcard .act{display:flex;gap:4px;padding:0 8px 8px;flex-wrap:wrap}
.pcard .act .btn{padding:3px 8px;font-size:11px}

#toast{position:fixed;left:50%;bottom:calc(46px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--raised-2);border:1px solid var(--line);border-radius:8px;padding:8px 14px;font-size:13px;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.4);max-width:min(520px,calc(100vw - 32px))}
#loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:13px;background:var(--ground);z-index:5}

@media (max-width:760px){
  #app{grid-template-columns:44px minmax(0,1fr);grid-template-areas:"top top" "tools vp" "status status"}
  #panel{position:absolute;right:0;top:44px;bottom:26px;width:min(310px,88%);z-index:20;transform:translateX(105%);transition:transform .2s;box-shadow:-10px 0 30px rgba(0,0,0,.4)}
  #panel.open{transform:none}
  .mobile-only{display:inline-flex}
  #projName{width:110px}
  #saveState,.brand span{display:none}
  .tool{width:32px;height:32px}
  #hint{display:none}
  #status .hide-sm{display:none}
}
@media (prefers-reduced-motion:reduce){ #panel{transition:none} }
</style>

<div id="app">
  <header id="top">
    <div class="brand">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M12 2.8l8 4.6v9.2l-8 4.6-8-4.6V7.4z"/><path d="M12 12l8-4.6M12 12v9.2M12 12L4 7.4"/></svg>
      <span>Forja 3D</span>
    </div>
    <button class="tb" id="btnProjects">Projetos</button>
    <input id="projName" aria-label="Nome do projeto" spellcheck="false">
    <span id="saveState"></span>
    <div class="sp"></div>
    <button class="tb icon" id="btnUndo" title="Desfazer (Ctrl+Z)" aria-label="Desfazer"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
    <button class="tb icon" id="btnRedo" title="Refazer (Ctrl+Shift+Z)" aria-label="Refazer"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg></button>
    <div class="menu">
      <button class="tb" id="btnImport">Importar</button>
      <div class="dd" id="ddImport" hidden>
        <button data-act="openJson">Projeto Forja <small>.json</small></button>
        <button data-act="openModel">Modelo 3D <small>.glb .gltf</small></button>
      </div>
    </div>
    <div class="menu">
      <button class="tb" id="btnExport">Exportar</button>
      <div class="dd" id="ddExport" hidden>
        <button data-act="saveJson">Projeto Forja <small>.json</small></button>
        <button data-act="saveGlb">Modelo para jogos/web <small>.glb</small></button>
        <button data-act="savePng">Imagem do viewport <small>.png</small></button>
      </div>
    </div>
    <button class="tb mobile-only" id="btnPanel">Painel</button>
  </header>

  <aside id="tools" aria-label="Ferramentas">
    <button class="tool on" id="mObject" title="Modo objeto (Tab)"><svg viewBox="0 0 24 24"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M12 12l8-4.5M12 12v9M12 12L4 7.5"/></svg></button>
    <button class="tool" id="mEdit" title="Modo edição de vértices (Tab)"><svg viewBox="0 0 24 24"><path d="M5 18L12 5l7 13z"/><circle cx="5" cy="18" r="1.8" fill="currentColor"/><circle cx="12" cy="5" r="1.8" fill="currentColor"/><circle cx="19" cy="18" r="1.8" fill="currentColor"/></svg></button>
    <div class="sep"></div>
    <button class="tool on" data-tool="translate" title="Mover (G)"><svg viewBox="0 0 24 24"><path d="M12 3v18M3 12h18M12 3l-3 3M12 3l3 3M12 21l-3-3M12 21l3-3M3 12l3-3M3 12l3 3M21 12l-3-3M21 12l-3 3"/></svg><kbd>G</kbd></button>
    <button class="tool" data-tool="rotate" title="Girar (R)"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v4h-4"/></svg><kbd>R</kbd></button>
    <button class="tool" data-tool="scale" title="Escalar (S)"><svg viewBox="0 0 24 24"><rect x="4" y="10" width="10" height="10" rx="1"/><path d="M13 11l7-7M14 4h6v6"/></svg><kbd>S</kbd></button>
    <div class="sep"></div>
    <button class="tool" id="btnAdd" title="Adicionar objeto (Shift+A)"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
    <button class="tool" id="btnDup" title="Duplicar (Shift+D)"><svg viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/></svg></button>
    <button class="tool" id="btnFocus" title="Enquadrar seleção (F)"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"/></svg></button>
    <button class="tool" id="btnDel" title="Excluir (X ou Delete)"><svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg></button>
  </aside>
  <div class="dd" id="addMenu" hidden></div>

  <main id="viewport">
    <div id="loading">Montando a oficina…</div>
    <div id="vpTop">
      <div class="seg" id="shadingSeg" role="group" aria-label="Sombreamento">
        <button data-sh="solid">Sólido</button><button data-sh="material" class="on">Material</button><button data-sh="wire">Arame</button>
      </div>
      <div class="seg"><button id="btnSnap" title="Encaixe em grade: 0,25 m · 15° · 10%">Ímã</button><button id="btnSpace" title="Eixos do gizmo">Global</button></div>
      <div class="seg" id="viewSeg" role="group" aria-label="Vistas">
        <button data-view="front" title="Vista frontal (1)">Frente</button><button data-view="right" title="Vista lateral (3)">Lado</button><button data-view="top" title="Vista de topo (7)">Topo</button><button data-view="persp" title="Perspectiva (5)">3/4</button>
      </div>
    </div>
    <div id="hint"></div>
    <div id="modeBadge">Objeto</div>
    <div id="selrect" hidden></div>
  </main>

  <aside id="panel" aria-label="Propriedades">
    <div id="outlinerWrap">
      <div class="ph"><span>Cena</span><span id="objCount"></span></div>
      <ul id="outliner"></ul>
    </div>
    <div id="tabs">
      <button data-tab="obj" class="on" id="tabObj">Objeto</button>
      <button data-tab="mat">Material</button>
      <button data-tab="scene">Ambiente</button>
    </div>
    <div id="props"></div>
  </aside>

  <footer id="status"><span id="stCounts"></span><span id="stSel" class="hide-sm"></span><span class="r" id="stMode"></span></footer>
</div>

<div class="modal" id="projModal" hidden>
  <div class="sheet" role="dialog" aria-labelledby="projTitle">
    <header>
      <h2 id="projTitle">Seus projetos</h2>
      <button class="btn pri" id="pNewBlank">Novo projeto</button>
      <button class="btn" id="pNewExample">Novo a partir do exemplo</button>
      <button class="btn" id="pImport">Abrir .json</button>
      <button class="btn" id="pClose">Fechar</button>
    </header>
    <div class="plist" id="plist"></div>
  </div>
</div>

<input type="file" id="fileJson" accept=".json,application/json" hidden>
<input type="file" id="fileModel" accept=".glb,.gltf" hidden>
<input type="file" id="fileTex" accept="image/*" hidden>
<div id="toast" hidden></div>

  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { TransformControls } from 'three/addons/controls/TransformControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const $ = s => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2, 10);
const r4 = v => Math.round(v * 1e4) / 1e4;
const DEG = THREE.MathUtils.RAD2DEG, RAD = THREE.MathUtils.DEG2RAD;

function el(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') e.className = v;
    else if (k === 'style') e.style.cssText = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);

const ray = new THREE.Raycaster();

  occRay.set(camera.position, dir.normalize()); occRay.far = dist;

renderer.domElement.addEventListener('pointerdown', e => {
  const p = ndc(e);
  down = { x: p.x, y: p.y, btn: e.button, onGizmo: transform.axis !== null && transform.object !== undefined, box: edit.box && e.button === 0 };
  if (down.box) { orbit.enabled = false; Object.assign(selrect.style, { left: p.x + 'px', top: p.y + 'px', width: '0px', height: '0px' }); selrect.hidden = false; }
});
renderer.domElement.addEventListener('pointermove', e => {
  if (!down || !down.box) return;
  const p = ndc(e);
  Object.assign(selrect.style, { left: Math.min(p.x, down.x) + 'px', top: Math.min(p.y, down.y) + 'px', width: Math.abs(p.x - down.x) + 'px', height: Math.abs(p.y - down.y) + 'px' });

const hist = { past: [], future: [], cur: null };

}

}

  state.objects = [];

const memStore = new Map();
const DB = {

      this.db = await new Promise((res, rej) => {

      });
    } catch (e) { this.db = null; }
  },
  run(mode, fn) { return new Promise((res, rej) => { const tx = this.db.transaction('projects', mode); const r = fn(tx.objectStore('projects')); tx.oncomplete = () => res(r && r.result); tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error); }); },
  async all() { return this.db ? this.run('readonly', s => s.getAll()) : [...memStore.values()]; },
  async get(id) { return this.db ? this.run('readonly', s => s.get(id)) : memStore.get(id); },
  async put(p) { if (this.db) return this.run('readwrite', s => s.put(p)); memStore.set(p.id, structuredClone(p)); },

$('#mEdit').onclick = () => enterEdit();
$('#btnSnap').onclick = () => setSnap(!state.snap);
$('#btnSpace').onclick = () => { const l = transform.space === 'world'; transform.setSpace(l ? 'local' : 'world'); $('#btnSpace').textContent = l ? 'Local' : 'Global'; };
$('#btnUndo').onclick = undo; $('#btnRedo').onclick = redo;
$('#btnDup').onclick = duplicateSelected; $('#btnDel').onclick = deleteSelected; $('#btnFocus').onclick = focusSelected;
$('#btnProjects').onclick = showProjects; $('#pClose').onclick = closeProjects;
$('#projModal').addEventListener('click', e => { if (e.target.id === 'projModal') closeProjects(); });
$('#pNewBlank').onclick = () => newProject(false); $('#pNewExample').onclick = () => newProject(true);
$('#pImport').onclick = () => $('#fileJson').click();
$('#btnPanel').onclick = () => $('#panel').classList.toggle('open');
$('#projName').addEventListener('input', e => { if (state.meta) { state.meta.name = e.target.value || 'Projeto sem título'; scheduleSave(); } });
$('#projName').addEventListener('keydown', e => { if (e.key === 'Enter') e.target.blur(); });

const addMenu = $('#addMenu');
addMenu.append(...Object.entries(PRIMS).map(([k, p]) => el('button', { onclick: () => { addMenu.hidden = true; addPrimitive(k); } }, p.label)));
function toggleMenu(menu, anchor) {
  const open = menu.hidden; document.querySelectorAll('.dd').forEach(d => d.hidden = true); menu.hidden = !open;
  if (open && menu === addMenu) { const r = anchor.getBoundingClientRect(), a = $('#app').getBoundingClientRect(); addMenu.style.top = (r.top - a.top) + 'px'; addMenu.style.left = (r.right - a.left + 6) + 'px'; }
}
$('#btnAdd').onclick = e => { e.stopPropagation(); toggleMenu(addMenu, e.currentTarget); };
$('#btnImport').onclick = e => { e.stopPropagation(); toggleMenu($('#ddImport')); };
$('#btnExport').onclick = e => { e.stopPropagation(); toggleMenu($('#ddExport')); };
document.addEventListener('click', e => { if (!e.target.closest('.dd')) document.querySelectorAll('.dd').forEach(d => d.hidden = true); });
const ACTS = { openJson: () => $('#fileJson').click(), openModel: () => $('#fileModel').click(), saveJson: exportJson, saveGlb: exportGlb, savePng: exportPng };
document.querySelectorAll('.dd [data-act]').forEach(b => b.addEventListener('click', () => { b.closest('.dd').hidden = true; ACTS[b.dataset.act](); }));

window.addEventListener('keydown', e => {
  const tg = e.target.tagName;
  if (tg === 'INPUT' || tg === 'SELECT' || tg === 'TEXTAREA') return;
  const k = e.key.toLowerCase(), ctrl = e.ctrlKey || e.metaKey;
  if (ctrl && k === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if (ctrl && k === 'y') { e.preventDefault(); redo(); return; }
  if (ctrl && k === 's') { e.preventDefault(); saveNow(); return; }
  if (ctrl) return;
  if (!$('#projModal').hidden) { if (k === 'escape') closeProjects(); return; }
  if (k === 'tab') { e.preventDefault(); toggleEdit(); return; }
  if (e.shiftKey && k === 'a') { toggleMenu(addMenu, $('#btnAdd')); return; }
  if (e.shiftKey && k === 'd') { duplicateSelected(); return; }
  switch (k) {
    case 'g': setTool('translate'); break;
    case 'r': setTool('rotate'); break;
    case 's': setTool('scale'); break;
    case 'f': focusSelected(); break;
    case 'x': case 'delete': deleteSelected(); break;
    case '1': setView('front'); break;
    case '3': setView('right'); break;
    case '7': setView('top'); break;
    case '5': setView('persp'); break;
    case 'a': selectAll(); break;
    case 'b': toggleBox(); break;
    case 'o': if (state.mode === 'edit') { edit.prop = !edit.prop; selectionChanged(); toast(edit.prop ? 'Edição proporcional ligada' : 'Edição proporcional desligada'); } break;
    case 'escape':
      document.querySelectorAll('.dd').forEach(d => d.hidden = true);
      if (state.mode === 'edit') { edit.sel.clear(); edit.box = false; selrect.hidden = true; selectionChanged(); } else selectObject(null);
      break;
  }
});
orbit.addEventListener('end', () => state.meta && scheduleSave());
document.addEventListener('visibilitychange', () => { if (document.hidden) saveNow(); });

/* ================= Loop ================= */
new ResizeObserver(() => {
  const w = viewport.clientWidth, h = viewport.clientHeight; if (!w || !h) return;
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
}).observe(viewport);
renderer.setAnimationLoop(() => {
  orbit.update();
  if (boxHelper.visible && state.selected) boxHelper.update();
  renderer.render(scene, camera);
});

/* ================= Início ================= */
(async () => {
  state.sceneSettings = defaultScene();
  await DB.open();
  let list = []; try { list = await DB.all(); } catch (e) {}
  const lastId = lsGet('forja3d:last');
  let p = list.find(x => x.id === lastId) || list.sort((a, b) => (b.updated || 0) - (a.updated || 0))[0];
  if (!p) { p = exampleProject(); await openProject(p); await saveNow(); }
  else await openProject(p);
  $('#loading').remove();
  updateModeUI(); setTool('translate'); updateUndo();
})().catch(err => { $('#loading').textContent = 'Não deu para iniciar o editor: ' + err.message; console.error(err); });
</script>
