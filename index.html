<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Forja 3D</title>
<link rel="icon" href="assets/icone.ico">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: bancada de três colunas (ferramentas | viewport | painel) com o viewport dominando; tema único escuro, como toda oficina 3D */
:root{
  --ground:#111418; --panel:#1a1e24; --raised:#232831; --raised-2:#2b313b; --line:#323945;
  --fg:#dce1e9; --muted:#8b94a3; --accent:#e08a4f; --accent-ink:#20140b; --sel:#62a9e4; --danger:#e26d6d; --ok:#79c28f;
  --f-ui:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--ground);color:var(--fg);font:13px/1.4 var(--f-ui);box-sizing:border-box;overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--sel);outline-offset:1px}

#app{height:100%;display:grid;grid-template-columns:50px minmax(0,1fr) 304px;grid-template-rows:44px minmax(0,1fr) 26px;
  grid-template-areas:"top top top" "tools vp panel" "status status status";
  border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel);position:relative}

/* barra superior */
#top{grid-area:top;display:flex;align-items:center;gap:8px;padding:0 10px;border-bottom:1px solid var(--line);min-width:0}
.brand{display:flex;align-items:center;gap:7px;font-weight:600;letter-spacing:.01em;white-space:nowrap;margin-right:4px}
.brand svg{color:var(--accent)}
.tb{background:transparent;border:1px solid transparent;border-radius:6px;padding:5px 9px;color:var(--fg);white-space:nowrap}
.tb:hover{background:var(--raised)}
.tb:disabled{opacity:.35;cursor:default;background:transparent}
.tb.icon{padding:5px 7px;display:inline-flex}
.tb.upd{background:var(--accent);color:var(--accent-ink);font-weight:500}
.tb.upd:hover{background:var(--accent);filter:brightness(1.08)}
.tb.upd:disabled{opacity:.8;cursor:progress;background:var(--accent)}
#projName{background:transparent;border:1px solid transparent;border-radius:6px;padding:5px 8px;min-width:70px;width:200px;flex:0 1 200px;font-weight:500}
#projName:hover{border-color:var(--line)}
#projName:focus{border-color:var(--sel);background:var(--ground);outline:none}
#saveState{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.sp{flex:1}
.menu{position:relative}
.dd{position:absolute;right:0;top:calc(100% + 4px);background:var(--raised);border:1px solid var(--line);border-radius:8px;padding:4px;min-width:210px;z-index:30;box-shadow:0 10px 30px rgba(0,0,0,.45)}
.dd button{display:flex;width:100%;text-align:left;background:none;border:0;padding:7px 10px;border-radius:5px;gap:10px;justify-content:space-between}
.dd button:hover{background:var(--raised-2)}
.dd button small{color:var(--muted);font-family:var(--f-mono);font-size:11px}
.mobile-only{display:none}

/* ferramentas */
#tools{grid-area:tools;border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0;overflow-y:auto}
.tool{width:36px;height:36px;border-radius:7px;border:1px solid transparent;background:transparent;display:grid;place-items:center;color:var(--muted);position:relative}
.tool:hover{background:var(--raised);color:var(--fg)}
.tool.on{background:var(--raised-2);color:var(--fg);border-color:var(--line)}
.tool.on::before{content:"";position:absolute;left:-7px;top:9px;bottom:9px;width:2px;border-radius:2px;background:var(--accent)}
.tool svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tool kbd{position:absolute;right:2px;bottom:1px;font:9px var(--f-mono);color:var(--muted)}
.sep{width:24px;height:1px;background:var(--line);margin:4px 0}
/* right:auto desfaz o right:0 do .dd: com left definido, os dois juntos esticavam o menu até a borda da tela */
#addMenu{position:absolute;left:54px;right:auto;top:150px;z-index:30;min-width:220px;max-width:280px;max-height:calc(100% - 16px);overflow-y:auto}

/* viewport */
#viewport{grid-area:vp;position:relative;min-width:0;min-height:0;background:#000;overflow:hidden;touch-action:none}
#viewport canvas{display:block;width:100%;height:100%}
#vpTop{position:absolute;left:10px;right:10px;top:10px;display:flex;flex-wrap:wrap;gap:8px;pointer-events:none}
#vpTop > *{pointer-events:auto}
.seg{display:inline-flex;background:rgba(20,23,28,.82);border:1px solid var(--line);border-radius:7px;padding:2px;backdrop-filter:blur(6px)}
.seg button{background:transparent;border:0;border-radius:5px;padding:4px 9px;color:var(--muted);font-size:12px}
.seg button:hover{color:var(--fg)}
.seg button.on{background:var(--raised-2);color:var(--fg)}
.seg button.hot{background:var(--accent);color:var(--accent-ink)}
#modeBadge{position:absolute;right:10px;bottom:10px;font:500 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;padding:4px 8px;border-radius:5px;background:rgba(20,23,28,.82);border:1px solid var(--line);color:var(--muted)}
#modeBadge.edit{color:var(--accent-ink);background:var(--accent);border-color:var(--accent)}
#hint{position:absolute;left:10px;bottom:10px;right:120px;color:var(--muted);font-size:12px;text-shadow:0 1px 2px #000;pointer-events:none}
#hint b{color:var(--fg);font-weight:500;font-family:var(--f-mono);font-size:11px;background:rgba(20,23,28,.8);border:1px solid var(--line);border-radius:3px;padding:0 4px}
#brushBar{position:absolute;left:10px;bottom:40px;max-width:calc(100% - 20px);display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;padding:6px 10px;background:rgba(20,23,28,.88);border:1px solid var(--line);border-radius:9px;backdrop-filter:blur(6px)}
#brushBar .seg{background:transparent;border:0;padding:0;flex-wrap:wrap}
#brushBar label{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
#brushBar input[type=range]{width:92px;accent-color:var(--accent)}
#brushBar output{font:11px var(--f-mono);color:var(--fg);min-width:30px;font-variant-numeric:tabular-nums}
.qr{display:flex;flex-wrap:wrap;gap:16px;align-items:center;padding:16px}
.qr .code{background:#fff;border-radius:8px;padding:6px;line-height:0}
.qr .code svg{width:190px;height:190px}
.qr .urls{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1}
.qr .urls b{font:500 16px var(--f-mono);word-break:break-all;color:var(--fg)}
#opPanel{position:absolute;left:50%;transform:translateX(-50%);bottom:44px;max-width:calc(100% - 20px);display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;padding:8px 12px;background:rgba(20,23,28,.92);border:1px solid var(--accent);border-radius:9px;backdrop-filter:blur(6px);z-index:6}
#opPanel b{font-weight:600;color:var(--accent)}
#opPanel label{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
#opPanel input[type=range]{width:120px;accent-color:var(--accent)}
#opPanel .seg{background:transparent}
#selrect{position:absolute;border:1px dashed var(--sel);background:rgba(98,169,228,.12);pointer-events:none}

/* painel */
#panel{grid-area:panel;border-left:1px solid var(--line);display:grid;grid-template-rows:minmax(110px,32%) auto minmax(0,1fr);min-height:0;background:var(--panel)}
.ph{display:flex;align-items:center;justify-content:space-between;padding:8px 12px 6px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
#outlinerWrap{display:flex;flex-direction:column;min-height:0;border-bottom:1px solid var(--line)}
#outliner{list-style:none;margin:0;padding:0 6px 6px;overflow-y:auto;min-height:0}
#outliner li{display:flex;align-items:center;gap:7px;padding:4px 6px;border-radius:5px;cursor:pointer}
#outliner li:hover{background:var(--raised)}
#outliner li.on{background:var(--raised-2);box-shadow:inset 2px 0 0 var(--accent)}
#outliner li.multi{background:var(--raised);box-shadow:inset 2px 0 0 var(--sel)}
@keyframes flashSel{0%{background:rgba(224,138,79,.55)}100%{background:var(--raised-2)}}
#outliner li.flash{animation:flashSel .9s ease-out}
@media (prefers-reduced-motion:reduce){#outliner li.flash{animation:none}}
#outliner li{-webkit-touch-callout:none}
/* Shift + clique na lista soma objetos: sem isso o navegador selecionava o texto */
#outliner,#tools,#top,#vpTop,#tabs,#status,#brushBar,.ph{user-select:none;-webkit-user-select:none}
#top input,#brushBar input{user-select:text;-webkit-user-select:text}
.abtag{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 4px;border-radius:5px;font:600 11px var(--f-mono);flex:none}
.abtag.a{background:var(--accent);color:var(--accent-ink)}
.abtag.b{background:var(--sel);color:#0b1724}
#abLayer{position:absolute;inset:0;pointer-events:none;overflow:hidden}
#abLayer .abtag{position:absolute;transform:translate(-50%,-100%);box-shadow:0 2px 8px rgba(0,0,0,.45)}
#outliner li .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#outliner li .ty{font:10px var(--f-mono);color:var(--muted)}
#outliner li input{flex:1;min-width:0;background:var(--ground);border:1px solid var(--sel);border-radius:4px;padding:1px 4px}
.eye{background:none;border:0;color:var(--muted);padding:2px;display:inline-flex}
.eye.off{opacity:.35}
.eye svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.6}
.dot{width:10px;height:10px;border-radius:3px;flex:none;border:1px solid rgba(255,255,255,.15);background-size:cover}

#tabs{display:flex;gap:2px;padding:6px 8px 0;border-bottom:1px solid var(--line)}
#tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:6px 10px;color:var(--muted)}
#tabs button.on{color:var(--fg);border-bottom-color:var(--accent)}
#props{overflow-y:auto;padding:10px 12px 18px;min-height:0;display:flex;flex-direction:column;gap:14px}
.grp{display:flex;flex-direction:column;gap:7px}
.grp h4{margin:0;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:500}
.row{display:grid;grid-template-columns:86px minmax(0,1fr);align-items:center;gap:8px}
.row > label{color:var(--muted);font-size:12px}
.v3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}
.num,.txt,select.sel{width:100%;min-width:0;background:var(--ground);border:1px solid var(--line);border-radius:5px;padding:4px 6px;font-family:var(--f-mono);font-size:12px;font-variant-numeric:tabular-nums}
.txt{font-family:var(--f-ui);font-size:13px}
select.sel{font-family:var(--f-ui)}
.num:focus,.txt:focus,select.sel:focus{border-color:var(--sel);outline:none}
.v3 .num{padding-left:18px;background-repeat:no-repeat;background-position:6px 50%;background-size:6px 12px}
.v3 .ax{position:relative}
.v3 .ax::before{content:attr(data-a);position:absolute;left:6px;top:50%;transform:translateY(-50%);font:600 10px var(--f-mono);pointer-events:none}
.v3 .ax:nth-child(1)::before{color:#e0716b}.v3 .ax:nth-child(2)::before{color:#8fc76f}.v3 .ax:nth-child(3)::before{color:#6fa3e0}
.sl{display:grid;grid-template-columns:minmax(0,1fr) 46px;gap:8px;align-items:center}
.sl input[type=range]{width:100%;accent-color:var(--accent)}
.sl output{font:12px var(--f-mono);color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
input[type=color]{width:100%;height:26px;border:1px solid var(--line);border-radius:5px;background:var(--ground);padding:2px}
.chk{display:flex;align-items:center;gap:7px;color:var(--fg);font-size:12px}
.chk input{accent-color:var(--accent)}
.btns{display:flex;flex-wrap:wrap;gap:6px}
.btn{background:var(--raised);border:1px solid var(--line);border-radius:6px;padding:5px 10px;font-size:12px}
.btn:hover{background:var(--raised-2)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:500}
.btn.dng{color:var(--danger)}
.btn.on{border-color:var(--accent);color:var(--accent)}
.note{color:var(--muted);font-size:12px;margin:0}
.empty{color:var(--muted);font-size:13px;line-height:1.5;padding:8px 0}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:6px}
.chip{border:1px solid var(--line);border-radius:7px;background:var(--ground);padding:4px;display:flex;flex-direction:column;gap:3px;align-items:stretch;text-align:left}
.chip .sw{height:34px;border-radius:4px;background-size:cover;background-position:center;border:1px solid rgba(255,255,255,.08)}
.chip span{font-size:10px;color:var(--muted);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.chip.on{border-color:var(--accent)}
.chip.on span{color:var(--fg)}
.chip.add{display:grid;place-items:center;color:var(--muted);font-size:20px;min-height:54px}

#status{grid-area:status;border-top:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 12px;font:11px var(--f-mono);color:var(--muted);white-space:nowrap;overflow:hidden;font-variant-numeric:tabular-nums}
#status .r{margin-left:auto}

/* modal de projetos */
.modal{position:fixed;inset:0;background:rgba(6,8,10,.66);display:grid;place-items:center;z-index:50;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:12px;width:min(880px,100%);max-height:100%;display:flex;flex-direction:column;overflow:hidden}
.sheet header{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.sheet header h2{margin:0;font-size:16px;font-weight:600;text-wrap:balance;margin-right:auto}
.plist{padding:16px;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.pcard{border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--ground);display:flex;flex-direction:column}
.pcard.cur{border-color:var(--accent)}
.pcard .th{aspect-ratio:16/10;max-width:100%;background:var(--raised) center/cover no-repeat;display:grid;place-items:center;color:var(--muted);font-size:12px;cursor:pointer}
.pcard .meta{padding:8px 10px;display:flex;flex-direction:column;gap:2px}
.pcard .meta b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pcard .meta small{color:var(--muted);font-size:11px}
.pcard .act{display:flex;gap:4px;padding:0 8px 8px;flex-wrap:wrap}
.pcard .act .btn{padding:3px 8px;font-size:11px}

#toast{position:fixed;left:50%;bottom:calc(46px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--raised-2);border:1px solid var(--line);border-radius:8px;padding:8px 14px;font-size:13px;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.4);max-width:min(520px,calc(100vw - 32px))}
#loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:13px;background:var(--ground);z-index:5}

@media (max-width:760px){
  #app{grid-template-columns:44px minmax(0,1fr);grid-template-areas:"top top" "tools vp" "status status"}
  #panel{position:absolute;right:0;top:44px;bottom:26px;width:min(310px,88%);z-index:20;transform:translateX(105%);transition:transform .2s;box-shadow:-10px 0 30px rgba(0,0,0,.4)}
  #panel.open{transform:none}
  .mobile-only{display:inline-flex}
  #projName{width:110px}
  #saveState,.brand span{display:none}
  .tool{width:32px;height:32px}
  #hint{display:none}
  #status .hide-sm{display:none}
  /* no celular: só o essencial na barra de cima (importar/exportar ficam para o computador) */
  #top .menu,#btnPhone{display:none}
  #top{gap:4px;padding:0 6px}
  #vpTop{gap:6px}
  #vpTop .seg:nth-child(2){display:none}
  .seg button{padding:5px 8px}
  #brushBar{bottom:10px;gap:6px 10px}
  #opPanel{bottom:10px}
  #brushBar input[type=range]{width:74px}
  #modeBadge{display:none}
}
@media (prefers-reduced-motion:reduce){ #panel{transition:none} }
</style>

<div id="app">
  <header id="top">
    <div class="brand">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M12 2.8l8 4.6v9.2l-8 4.6-8-4.6V7.4z"/><path d="M12 12l8-4.6M12 12v9.2M12 12L4 7.4"/></svg>
      <span>Forja 3D</span>
    </div>
    <button class="tb" id="btnProjects">Projetos</button>
    <input id="projName" aria-label="Nome do projeto" spellcheck="false">
    <span id="saveState"></span>
    <div class="sp"></div>
    <button class="tb icon" id="btnUndo" title="Desfazer (Ctrl+Z)" aria-label="Desfazer"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
    <button class="tb icon" id="btnRedo" title="Refazer (Ctrl+Shift+Z)" aria-label="Refazer"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg></button>
    <div class="menu">
      <button class="tb" id="btnImport">Importar</button>
      <div class="dd" id="ddImport" hidden>
        <button data-act="openJson">Projeto Forja <small>.json</small></button>
        <button data-act="openModel">Modelo 3D <small>.glb .gltf</small></button>
      </div>
    </div>
    <div class="menu">
      <button class="tb" id="btnExport">Exportar</button>
      <div class="dd" id="ddExport" hidden>
        <button data-act="saveJson">Projeto Forja <small>.json</small></button>
        <button data-act="saveGlb">Modelo para jogos/web <small>.glb</small></button>
        <button data-act="savePng">Imagem do viewport <small>.png</small></button>
      </div>
    </div>
    <button class="tb upd" id="btnUpdate" hidden></button>
    <button class="tb" id="btnPhone" hidden title="Abrir esta Forja no celular ou tablet">Celular</button>
    <button class="tb mobile-only" id="btnPanel">Painel</button>
  </header>

  <aside id="tools" aria-label="Ferramentas">
    <button class="tool on" id="mObject" title="Modo objeto (Tab)"><svg viewBox="0 0 24 24"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M12 12l8-4.5M12 12v9M12 12L4 7.5"/></svg></button>
    <button class="tool" id="mEdit" title="Modo edição de vértices (Tab)"><svg viewBox="0 0 24 24"><path d="M5 18L12 5l7 13z"/><circle cx="5" cy="18" r="1.8" fill="currentColor"/><circle cx="12" cy="5" r="1.8" fill="currentColor"/><circle cx="19" cy="18" r="1.8" fill="currentColor"/></svg></button>
    <button class="tool" id="btnBrush" title="Pincel de esculpir (P)"><svg viewBox="0 0 24 24"><path d="M15 3.5l5.5 5.5-8.2 8.2a2.5 2.5 0 0 1-1.8.7H7v-3.4c0-.7.3-1.3.7-1.8z"/><path d="M12.5 6l5.5 5.5"/><path d="M4 21c1.5 0 3-1 3-3"/></svg><kbd>P</kbd></button>
    <div class="sep"></div>
    <button class="tool on" data-tool="translate" title="Mover (G)"><svg viewBox="0 0 24 24"><path d="M12 3v18M3 12h18M12 3l-3 3M12 3l3 3M12 21l-3-3M12 21l3-3M3 12l3-3M3 12l3 3M21 12l-3-3M21 12l-3 3"/></svg><kbd>G</kbd></button>
    <button class="tool" data-tool="rotate" title="Girar (R)"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v4h-4"/></svg><kbd>R</kbd></button>
    <button class="tool" data-tool="scale" title="Escalar (S)"><svg viewBox="0 0 24 24"><rect x="4" y="10" width="10" height="10" rx="1"/><path d="M13 11l7-7M14 4h6v6"/></svg><kbd>S</kbd></button>
    <div class="sep"></div>
    <button class="tool" id="btnAdd" title="Adicionar objeto (Shift+A)"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
    <button class="tool" id="btnDup" title="Duplicar (Shift+D)"><svg viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/></svg></button>

    </div>

/* ---------- Arredondar quinas ---------- */
// Refina a malha até as arestas ficarem bem menores que o raio e alisa (suavização de Taubin, que quase não

// dobras viram curva. Com arestas/vértices selecionados, arredonda só perto deles; sem seleção, a peça toda.
// Na região arredondada os vértices são soldados, para a luz deslizar sem marcar a antiga quina.

/* ================= Topologia: arestas, faces, extrudar e cortar ================= */
// A malha é feita de triângulos; as primitivas montam cada "quadrado" com dois triângulos que dividem a diagonal.

    const u = l[0] === t ? l[1] : l[0];

    const gt = tg(t); let r = 0; while (ekey(gt[r], gt[(r + 1) % 3]) !== e) r++;

      const v = project(g); if (v.z > 1) continue;
      const dd = Math.hypot((v.x + 1) / 2 * p.w - p.x, (1 - v.y) / 2 * p.h - p.y);
      if (dd < bestD && visibleVertex(g)) { bestD = dd; best = g; }
    }
    let picks = [];
    if (best >= 0) picks = [best];
    else {
      const hit = ray.intersectObject(edit.obj.mesh, false)[0];
      if (hit && hit.face) picks = [hit.face.a, hit.face.b, hit.face.c].map(i => edit.v2g[i]);
    }
    clearElemSel();
    if (!e.shiftKey) edit.sel.clear();
    for (const g of picks) { if (e.shiftKey && edit.sel.has(g) && picks.length === 1) edit.sel.delete(g); else edit.sel.add(g); }
    selectionChanged(); return;
  }
  const hits = ray.intersectObjects(state.objects.filter(o => o.mesh.visible).map(o => o.pick || o.mesh), false);
  const hitObj = hits.length ? state.objects.find(o => (o.pick || o.mesh) === hits[0].object) : null;
  if (e.shiftKey && !hitObj) return;   // Shift + clique no vazio não desfaz a seleção
  selectObject(hitObj, e.shiftKey);
}

function setView(v) {
  const dist = camera.position.distanceTo(orbit.target);
  const dir = { front: [0, 0, 1], right: [1, 0, 0], top: [0, 1, 0.0001], persp: [1, 0.72, 1.15] }[v];
  camera.position.copy(orbit.target).addScaledVector(new THREE.Vector3(...dir).normalize(), dist); orbit.update();
}
// Câmera padrão: volta para a vista 3/4 enquadrando tudo que está visível (ou a posição inicial, com a cena vazia)
function resetView() {
  // planos (chão) ficam de fora do enquadramento, senão um piso grande deixa as peças minúsculas
  const box = new THREE.Box3(), vis = state.objects.filter(o => o.mesh.visible), pieces = vis.filter(o => o.prim !== 'plane');
  (pieces.length ? pieces : vis).forEach(o => box.expandByObject(o.mesh));
  const dir = new THREE.Vector3(1, 0.72, 1.15).normalize();
  if (box.isEmpty()) { orbit.target.set(0, 0.5, 0); camera.position.set(6, 4.5, 7.5); }
  else {
    const s = box.getBoundingSphere(new THREE.Sphere()), r = Math.max(s.radius, 0.5);
    const dist = r / Math.sin(camera.fov * RAD / 2) * 1.1;
    orbit.maxDistance = Math.max(150, dist * 2);
    orbit.target.copy(s.center); camera.position.copy(s.center).addScaledVector(dir, dist);

  orbit.update(); scheduleSave();
}
function focusSelected() {
  const box = new THREE.Box3();
  if (state.mode === 'edit' && edit.sel.size) edit.sel.forEach(g => box.expandByPoint(edit.groups[g].p.clone().applyMatrix4(edit.obj.mesh.matrixWorld)));
  else if (state.selected) box.setFromObject(state.selected.mesh);
  else state.objects.forEach(o => o.mesh.visible && box.expandByObject(o.mesh));
  if (box.isEmpty()) return;
  const s = box.getBoundingSphere(new THREE.Sphere()), r = Math.max(s.radius, 0.3);
  const dir = camera.position.clone().sub(orbit.target).normalize();
  orbit.target.copy(s.center); camera.position.copy(s.center).addScaledVector(dir, r / Math.sin(camera.fov * RAD / 2) * 1.15); orbit.update();
}

const hist = { past: [], future: [], cur: null };

  return { v: 1, scene: { ...state.sceneSettings }, materials: state.materials.map(m => ({ ...m, repeat: [...m.repeat] })),
    // textura procedural vai só com a receita; a imagem é refeita ao abrir
    textures: Object.fromEntries(Object.entries(state.textures).map(([k, t]) => [k, t.gen ? { name: t.name, gen: t.gen } : { name: t.name, src: t.src }])),
    objects: state.objects.map(serObj) };
}
function resetHistory() { hist.past = []; hist.future = []; hist.cur = serialize(); updateUndo(); }
function commit() {
  hist.past.push(hist.cur); if (hist.past.length > 60) hist.past.shift();
  hist.cur = serialize(); hist.future = []; updateUndo(); scheduleSave(); refreshStatus(); renderOutliner();
}
function undo() { if (!hist.past.length) return; hist.future.push(hist.cur); hist.cur = hist.past.pop(); applyData(hist.cur, { keepSelection: true }); updateUndo(); scheduleSave(); }
function redo() { if (!hist.future.length) return; hist.past.push(hist.cur); hist.cur = hist.future.pop(); applyData(hist.cur, { keepSelection: true }); updateUndo(); scheduleSave(); }
function updateUndo() { $('#btnUndo').disabled = !hist.past.length; $('#btnRedo').disabled = !hist.future.length; }

function applyData(d, opts = {}) {
  const keepId = state.selected && state.selected.id, wasEdit = state.mode === 'edit', wasBrush = brush.on;
  if (wasEdit) exitEdit();
  transform.detach(); state.selected = null;
  for (const o of state.objects) { scene.remove(o.mesh); disposeObj(o); }
  state.objects = [];
  const nt = {};
  const sameTex = (o, t) => o && (t.gen ? JSON.stringify(o.gen) === JSON.stringify(t.gen) : !o.gen && o.src === t.src);
  for (const [id, t] of Object.entries(d.textures || {})) { const old = state.textures[id]; nt[id] = sameTex(old, t) ? old : t.gen ? { name: t.name, gen: t.gen, src: genSrc(t.gen) } : { name: t.name, src: t.src }; }
  state.textures = nt;
  for (const [k, t] of texClones) { const id = k.split('|')[0]; if (!nt[id] || nt[id].derived?.indexOf(t) < 0) { t.dispose(); texClones.delete(k); } }
  state.materials = (d.materials && d.materials.length ? d.materials : [{ ...defaultMat(), name: 'Padrão' }]).map(m => ({ ...defaultMat(), ...m, repeat: [...(m.repeat || [1, 1])] }));
  for (const [id, m] of matCache) if (!state.materials.find(x => x.id === id)) { m.dispose(); matCache.delete(id); }
  state.sceneSettings = { ...defaultScene(), ...(d.scene || {}) }; applyScene();
  state.materials.forEach(getMat);
  for (const od of d.objects || []) createObject(od);
  if (opts.camera && d.camera) { camera.position.fromArray(d.camera.pos); orbit.target.fromArray(d.camera.target); orbit.update(); }
  const sel = opts.keepSelection ? state.objects.find(o => o.id === keepId) : null;
  selectObject(sel || null);
  // desfazer/refazer não tira você da ferramenta: volta para o modo edição e, se estava esculpindo, com o pincel

}
function sunDir(s) {
  const e = s.sunElev * RAD, a = s.sunAzim * RAD;
  return new THREE.Vector3(Math.cos(e) * Math.sin(a), Math.sin(e), Math.cos(e) * Math.cos(a));
}
// Reflexo "Céu e sol": um céu em degradê com o disco do sol, convertido em mapa de reflexo. Metal e vidro passam a
// refletir o céu e o brilho do sol na direção certa. Fica guardado por combinação de cores/posição.
const skyEnvCache = new Map();
function skyEnv(s) {
  const key = [s.sky, s.ground, s.sunColor, s.sunElev, s.sunAzim, s.sun].join('|');
  if (skyEnvCache.has(key)) return skyEnvCache.get(key);
  const mat = new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false,
    uniforms: { top: { value: new THREE.Color(s.sky) }, bottom: { value: new THREE.Color(s.ground) }, sunDir: { value: sunDir(s) }, sunCol: { value: new THREE.Color(s.sunColor).multiplyScalar(3 + s.sun * 6) } },
    vertexShader: 'varying vec3 vDir; void main(){ vDir = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
    fragmentShader: 'uniform vec3 top; uniform vec3 bottom; uniform vec3 sunDir; uniform vec3 sunCol; varying vec3 vDir;' +
      'void main(){ vec3 d = normalize(vDir); float h = d.y; vec3 horizon = mix(bottom, top, 0.6) * 1.2;' +
      'vec3 c = h > 0.0 ? mix(horizon, top, pow(h, 0.55)) : mix(horizon, bottom, pow(-h, 0.35));' +
      'float k = max(dot(d, sunDir), 0.0); c += sunCol * (pow(k, 1200.0) * 6.0 + pow(k, 24.0) * 0.08); gl_FragColor = vec4(c, 1.0); }',
  });
  const sc = new THREE.Scene(), sphere = new THREE.Mesh(new THREE.SphereGeometry(10, 64, 32), mat);
  sc.add(sphere);
  const tex = pmrem.fromScene(sc, 0).texture;
  sphere.geometry.dispose(); mat.dispose();
  if (skyEnvCache.size > 3) { const [k0, t0] = skyEnvCache.entries().next().value; if (t0 !== scene.environment) t0.dispose(); skyEnvCache.delete(k0); }
  skyEnvCache.set(key, tex);

}
let envTimer;
function applyScene() {
  const s = state.sceneSettings;
  scene.background = new THREE.Color(s.background);

  sun.position.copy(sunDir(s)).multiplyScalar(14);

/* ================= Projetos (servidor Node do PC ou IndexedDB) ================= */
// Aberta pelo serve.js (app instalado, ou celular na rede), os projetos ficam em arquivos no computador e o PC e o
// celular veem os mesmos. Em qualquer outro lugar (artifact, servidor estático) ficam no IndexedDB deste navegador.
const memStore = new Map();
const DB = {
  db: null, server: null,
  get where() { return this.server ? 'no computador' : this.db ? 'no navegador' : 'só nesta aba'; },
  async open() {
    try {
      const r = await fetch('api/info', { cache: 'no-store' });
      if (r.ok && (r.headers.get('content-type') || '').includes('json')) { this.server = await r.json(); return; }
    } catch (e) {}
    try {
      this.db = await new Promise((res, rej) => {
        const r = indexedDB.open('forja3d', 1);
        r.onupgradeneeded = () => r.result.createObjectStore('projects', { keyPath: 'id' });
        r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
      });
      // sem servidor (Vercel, artifact), os projetos só existem neste navegador: pede para ele não apagar
      // esses dados quando faltar espaço (no Safari também reduz a limpeza automática de sites pouco usados)
      this.persisted = await navigator.storage?.persist?.().catch(() => false) ?? false;
    } catch (e) { this.db = null; }
  },
  run(mode, fn) { return new Promise((res, rej) => { const tx = this.db.transaction('projects', mode); const r = fn(tx.objectStore('projects')); tx.oncomplete = () => res(r && r.result); tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error); }); },
  async api(path, opt = {}) {
    const r = await fetch('api/' + path, { cache: 'no-store', ...opt });
    if (!r.ok) throw new Error((await r.json().catch(() => ({}))).erro || 'erro ' + r.status);
    return r.json();
  },
  async all() { if (this.server) return this.api('projetos'); return this.db ? this.run('readonly', s => s.getAll()) : [...memStore.values()]; },
  async get(id) { if (this.server) return this.api('projetos/' + id).catch(() => null); return this.db ? this.run('readonly', s => s.get(id)) : memStore.get(id); },
  async put(p) {
    if (this.server) return this.api('projetos/' + p.id, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(p) });
    if (this.db) return this.run('readwrite', s => s.put(p)); memStore.set(p.id, structuredClone(p));
  },
  async del(id) { if (this.server) return this.api('projetos/' + id, { method: 'DELETE' }); if (this.db) return this.run('readwrite', s => s.delete(id)); memStore.delete(id); },
};

function captureThumb() {

  toast(/claude\.(ai|site)|claudeusercontent/.test(location.hostname) ? `Baixando ${name}. Se nada acontecer, use a Forja pelo site ou pelo app instalado para exportar.` : `Baixando ${name}.`);
}

      if (!n.isMesh) return;
      const g = n.geometry.clone().applyMatrix4(n.matrixWorld), p = g.attributes.position, u = g.attributes.uv;
      const P = [], U = u ? [] : null;
      for (let i = 0; i < p.count; i++) { P.push(p.getX(i), p.getY(i), p.getZ(i)); if (U) U.push(u.getX(i), u.getY(i)); }
      const sm = Array.isArray(n.material) ? n.material[0] : n.material;
      const md = { ...defaultMat(), name: (sm && sm.name) || n.name || 'Importado' };
      if (sm) { if (sm.color) md.color = '#' + sm.color.getHexString(); if (sm.metalness != null) md.metalness = sm.metalness; if (sm.roughness != null) md.roughness = sm.roughness; }
      if (sm && sm.map && sm.map.image) { try { md.map = addTexture(md.name, imageToDataURL(sm.map.image)); } catch (e) {} }
      state.materials.push(md); getMat(md);

      g.dispose();
    });
    if (!made.length) { toast('Nenhuma malha encontrada nesse arquivo.'); return; }
    selectObject(made[0]); commit(); toast(`${made.length} malha${made.length > 1 ? 's' : ''} importada${made.length > 1 ? 's' : ''} de ${file.name}.`);
  }, err => toast('Não deu para ler o modelo. Arquivos .gltf com texturas separadas não funcionam; use .glb. (' + (err?.message || err) + ')'));

}

  b.hidden = false;
  b.disabled = u.fase === 'baixando' || u.fase === 'instalando';
  b.textContent = u.fase === 'baixando' ? `Baixando ${u.pct}%…` : u.fase === 'instalando' ? 'Instalando…' : u.fase === 'erro' ? 'Tentar atualizar de novo' : `Atualizar para ${u.nova}`;
  b.title = u.erro ? 'Falhou: ' + u.erro : `Você está na ${u.atual}. Baixa a ${u.nova} e instala por cima; seus projetos continuam onde estão.`;

}

  await saveNow();
  let u;
  try { u = await DB.api('atualizacao', { method: 'POST' }); } catch (e) { toast(e.message); return; }
  showUpdate(u);
  const from = u.atual;
  clearInterval(updPoll);
  updPoll = setInterval(async () => {
    try {
      const s = await DB.api('atualizacao');

      if (s.atual !== from) { clearInterval(updPoll); location.reload(); return; }
      showUpdate(s);
      if (s.fase === 'erro') { clearInterval(updPoll); toast('A atualização falhou: ' + s.erro); }
    } catch (e) { /* servidor reiniciando no meio da instalação */ }
  }, 1500);
};
setInterval(checkUpdate, 10 * 60e3);
$('#phClose').onclick = () => $('#phoneModal').hidden = true;
$('#phoneModal').addEventListener('click', e => { if (e.target.id === 'phoneModal') $('#phoneModal').hidden = true; });
$('#projName').addEventListener('input', e => { if (state.meta) { state.meta.name = e.target.value || 'Projeto sem título'; scheduleSave(); } });
$('#projName').addEventListener('keydown', e => { if (e.key === 'Enter') e.target.blur(); });

const addMenu = $('#addMenu');
addMenu.append(...Object.entries(PRIMS).map(([k, p]) => el('button', { onclick: () => { addMenu.hidden = true; addPrimitive(k); } }, p.label)),
  el('div', { style: 'height:1px;background:var(--line);margin:4px 6px' }),
  ...Object.entries(LIGHTS).map(([k, l]) => el('button', { onclick: () => { addMenu.hidden = true; addLight(k); } }, 'Luz: ' + l.label, el('small', {}, l.short))));
function toggleMenu(menu, anchor) {
  const open = menu.hidden; document.querySelectorAll('.dd').forEach(d => d.hidden = true); menu.hidden = !open;
  if (open && menu === addMenu) {
    const r = anchor.getBoundingClientRect(), a = $('#app').getBoundingClientRect();
    addMenu.style.left = (r.right - a.left + 6) + 'px';
    // ao lado do botão, mas subindo o que for preciso para o menu inteiro caber na janela
    addMenu.style.top = Math.max(8, Math.min(r.top - a.top, a.height - addMenu.offsetHeight - 8)) + 'px';
  }
}
$('#btnAdd').onclick = e => { e.stopPropagation(); toggleMenu(addMenu, e.currentTarget); };
$('#btnImport').onclick = e => { e.stopPropagation(); toggleMenu($('#ddImport')); };
$('#btnExport').onclick = e => { e.stopPropagation(); toggleMenu($('#ddExport')); };
document.addEventListener('click', e => { if (!e.target.closest('.dd')) document.querySelectorAll('.dd').forEach(d => d.hidden = true); });
const ACTS = { openJson: () => $('#fileJson').click(), openModel: () => $('#fileModel').click(), saveJson: exportJson, saveGlb: exportGlb, savePng: exportPng };
document.querySelectorAll('.dd [data-act]').forEach(b => b.addEventListener('click', () => { b.closest('.dd').hidden = true; ACTS[b.dataset.act](); }));

window.addEventListener('keydown', e => {
  const tg = e.target.tagName;
  if (tg === 'INPUT' || tg === 'SELECT' || tg === 'TEXTAREA') return;
  const k = e.key.toLowerCase(), ctrl = e.ctrlKey || e.metaKey;
  // operação com prévia aberta: Enter aplica, Esc (ou Ctrl+Z) cancela, Shift alterna 1/2 cortes; o resto fica parado
  if (edit.op) {
    if (k === 'enter') { e.preventDefault(); applyOp(); }
    else if (k === 'escape' || (ctrl && k === 'z')) { e.preventDefault(); cancelOp(); }
    else if (k === 'shift' && edit.op.kind === 'loopSlide') startLoopCut(edit.op.cuts === 2 ? 1 : 2);
    return;
  }
  if (ctrl && k === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if (ctrl && k === 'y') { e.preventDefault(); redo(); return; }
  if (ctrl && k === 's') { e.preventDefault(); saveNow(); return; }
  if (ctrl) return;
  if (!$('#projModal').hidden) { if (k === 'escape') closeProjects(); return; }
  if (!$('#phoneModal').hidden) { if (k === 'escape') $('#phoneModal').hidden = true; return; }
  if (k === 'tab') { e.preventDefault(); toggleEdit(); return; }
  if (e.shiftKey && k === 'a') { toggleMenu(addMenu, $('#btnAdd')); return; }
  if (e.shiftKey && k === 'd') { duplicateSelected(); return; }
  switch (k) {
    case 'g': setTool('translate'); break;
    case 'r': setTool('rotate'); break;
    case 's': setTool('scale'); break;
    case 'f': focusSelected(); break;
    case 'h': case 'home': resetView(); break;
    case 'x': case 'delete': deleteSelected(); break;
    case '1': setView('front'); break;
    case '3': setView('right'); break;
    case '7': setView('top'); break;
    case '5': setView('persp'); break;
    case 'a': selectAll(); break;
    case 'b': toggleBox(); break;
    case 'p': setBrush(!brush.on); break;
    case 'e': startExtrude(); break;
    case 'm': if (state.mode === 'edit') setMirror(!edit.mirror); break;
    case 'c': startLoopCut(e.shiftKey ? 2 : 1); break;
    case '[': if (brush.on) { brush.radius = Math.max(0.03, +(brush.radius / 1.15).toFixed(3)); syncBrushBar(); } break;
    case ']': if (brush.on) { brush.radius = Math.min(2.5, +(brush.radius * 1.15).toFixed(3)); syncBrushBar(); } break;
    case 'o': if (state.mode === 'edit') { edit.prop = !edit.prop; selectionChanged(); toast(edit.prop ? 'Edição proporcional ligada' : 'Edição proporcional desligada'); } break;
    case 'escape':
      document.querySelectorAll('.dd').forEach(d => d.hidden = true);
      if (brush.on) setBrush(false);
      else if (state.mode === 'edit') { edit.sel.clear(); clearElemSel(); edit.box = false; selrect.hidden = true; selectionChanged(); } else selectObject(null);
      break;
  }
});
orbit.addEventListener('end', () => state.meta && scheduleSave());
document.addEventListener('visibilitychange', () => { if (document.hidden) saveNow(); });

/* ================= Loop ================= */
new ResizeObserver(() => {
  const w = viewport.clientWidth, h = viewport.clientHeight; if (!w || !h) return;
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
  edgeMatSel.resolution.set(w, h); edgeMatMir.resolution.set(w, h);
}).observe(viewport);
renderer.setAnimationLoop(() => {
  orbit.update();
  if (boxHelper.visible && state.selected) boxHelper.update();
  for (const b of multiBoxes) b.update();
  brushCursorM.visible = brushCursor.visible && edit.mirror && state.mode === 'edit';
  placeAbTags();
  renderer.render(scene, camera);
});

/* ================= Início ================= */
(async () => {
  state.sceneSettings = defaultScene();
  await DB.open();
  let list = []; try { list = await DB.all(); } catch (e) {}
  const lastId = lsGet('forja3d:last');
  const pick = list.find(x => x.id === lastId) || list.sort((a, b) => (b.updated || 0) - (a.updated || 0))[0];
  const p = pick && (pick.objects ? pick : await DB.get(pick.id));
  if (!p) { await openProject(exampleProject()); await saveNow(); }
  else await openProject(p);
  // botão Celular só no computador que roda o servidor (no próprio celular não faz sentido)
  $('#btnPhone').hidden = !(DB.server && DB.server.local);
  // a rede liga logo depois que o servidor sobe: se ainda não respondeu com o IP, pergunta de novo em seguida
  updateTitle().then(ok => { if (!ok) setTimeout(updateTitle, 2000); });
  // o servidor confere o GitHub assim que sobe: pergunta agora e de novo daqui a pouco, quando a resposta já chegou
  checkUpdate(); setTimeout(checkUpdate, 15000);
  $('#loading').remove();
  updateModeUI(); setTool('translate'); updateUndo();
})().catch(err => { $('#loading').textContent = 'Não deu para iniciar o editor: ' + err.message; console.error(err); });
</script>
